<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="100%" height="100%">
  <defs>
    <!-- Frame Wood & Gold Gradients -->
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#CA8A04" />
      <stop offset="70%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="innerVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="frameGlass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#frameGlass)">
    <!-- Outer Luxury Golden Wooden Shadowbox Frame (Photo 2) -->
    <rect x="25" y="25" width="400" height="550" rx="8" fill="#2E1C0C" stroke="url(#goldFrame)" stroke-width="14" />
    <!-- Inner Gold Filigree Bevel Line -->
    <rect x="36" y="36" width="378" height="528" rx="4" fill="none" stroke="#EAB308" stroke-width="2" />

    <!-- Deep Blue Velvet Interior Matting -->
    <rect x="42" y="42" width="366" height="516" fill="url(#innerVelvet)" />

    <!-- Glass Reflection Highlight Diagonal Streak -->
    <path d="M 45 45 L 200 45 L 80 550 L 45 550 Z" fill="#FFFFFF" opacity="0.04" />
    <path d="M 230 45 L 270 45 L 150 550 L 110 550 Z" fill="#FFFFFF" opacity="0.02" />

    <!-- The Framed Mayilpeeli (Peacock Feather) Nettipattam Centerpiece -->
    <g transform="translate(15, 10)">
      <!-- Peacock Feather Outer Perimeter -->
      <path d="M 125 75 Q 85 240 160 420 Q 210 440 260 420 Q 335 240 295 75 Z" fill="#064E3B" stroke="#047857" stroke-width="3" />

      <!-- Top Navy Velvet Bar with Gold studs -->
      <polygon points="135,70 285,70 280,105 140,105" fill="#0A0F1D" stroke="#EAB308" stroke-width="2" />
      <circle cx="160" cy="87" r="8" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="210" cy="87" r="8" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="260" cy="87" r="8" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.5" />

      <!-- Inner Gold Beaded Border -->
      <path d="M 140,108 L 280,108 L 255,400 Q 210,430 165,400 Z" fill="#0F172A" stroke="#EAB308" stroke-width="2.5" />

      <!-- Silver Pearl Body -->
      <g fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5">
        <circle cx="155" cy="125" r="4" /><circle cx="170" cy="125" r="4" /><circle cx="185" cy="125" r="4" /><circle cx="200" cy="125" r="4" /><circle cx="215" cy="125" r="4" /><circle cx="230" cy="125" r="4" /><circle cx="245" cy="125" r="4" /><circle cx="260" cy="125" r="4" />
        <circle cx="152" cy="148" r="3.5" /><circle cx="268" cy="148" r="3.5" />
        <circle cx="155" cy="180" r="3.5" /><circle cx="265" cy="180" r="3.5" />
        <circle cx="160" cy="225" r="3.5" /><circle cx="260" cy="225" r="3.5" />
        <circle cx="168" cy="275" r="3.5" /><circle cx="252" cy="275" r="3.5" />
        <circle cx="178" cy="325" r="3.5" /><circle cx="242" cy="325" r="3.5" />
        <circle cx="188" cy="375" r="3.5" /><circle cx="232" cy="375" r="3.5" />
      </g>

      <!-- 3 Radiant Gold Sunburst Medallions with Silver Fluting -->
      <circle cx="175" cy="165" r="18" fill="#F8FAFC" stroke="#EAB308" stroke-width="1.5" />
      <circle cx="175" cy="165" r="11" fill="#CA8A04" />
      <circle cx="210" cy="155" r="14" fill="#F8FAFC" stroke="#EAB308" stroke-width="1.5" />
      <circle cx="210" cy="155" r="8" fill="#CA8A04" />
      <circle cx="245" cy="165" r="18" fill="#F8FAFC" stroke="#EAB308" stroke-width="1.5" />
      <circle cx="245" cy="165" r="11" fill="#CA8A04" />

      <!-- Center Gold Ganesha Emblem with Solar Ring -->
      <circle cx="210" cy="215" r="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <path d="M 205 205 Q 210 200 215 205 L 213 226 Q 210 230 207 226 Z" fill="#CA8A04" />
      <circle cx="210" cy="208" r="4" fill="#FFFFFF" />

      <!-- Cascading Gold Crescents -->
      <path d="M 195 250 Q 210 262 225 250 Q 210 258 195 250 Z" fill="#CA8A04" />
      <path d="M 197 270 Q 210 282 223 270 Q 210 278 197 270 Z" fill="#CA8A04" />
      <path d="M 200 290 Q 210 302 220 290 Q 210 298 200 290 Z" fill="#CA8A04" />

      <!-- Bottom Brass Cone & Rich Blue Silk Tassel -->
      <path d="M 202 435 L 218 435 L 214 460 L 206 460 Z" fill="#CA8A04" />
      <circle cx="210" cy="462" r="6" fill="#EAB308" />
      <path d="M 205 466 C 200 495, 198 520, 204 545" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round" fill="none" />
      <path d="M 210 468 C 210 500, 212 525, 210 548" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 215 466 C 220 495, 222 520, 216 545" stroke="#1D4ED8" stroke-width="8" stroke-linecap="round" fill="none" />
      <rect x="204" y="472" width="12" height="3" rx="1.5" fill="#EAB308" />
    </g>

    <!-- Bottom Luxury Brass Plaque in Frame -->
    <rect x="150" y="525" width="150" height="24" rx="3" fill="#D97706" stroke="#FEF08A" stroke-width="1" />
    <text x="225" y="541" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="#451A03" text-anchor="middle" letter-spacing="1">
      CHITHRADARSHA ARTISTRY
    </text>
  </g>
</svg>
