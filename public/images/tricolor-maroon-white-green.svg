<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="100%" height="100%">
  <defs>
    <linearGradient id="goldTricolor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="sphereTricolor" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>
    <filter id="shadowTricolor" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#shadowTricolor)">
    <!-- Top Hanging Cord -->
    <path d="M 220 15 L 140 48 M 220 15 L 300 48" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Heritage Tricolor Woolen Fringe: Maroon, White & Emerald Green (Photo 7) -->
    <!-- Left Border -->
    <path d="M 120 48 L 105 48 L 107 105 L 125 105 Z" fill="#881337" />
    <path d="M 125 105 L 107 105 L 112 165 L 134 165 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
    <path d="M 134 165 L 112 165 L 118 225 L 143 225 Z" fill="#047857" />
    <path d="M 143 225 L 118 225 L 126 285 L 152 285 Z" fill="#881337" />
    <path d="M 152 285 L 126 285 L 135 345 L 161 345 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
    <path d="M 161 345 L 135 345 L 147 405 L 175 405 Z" fill="#047857" />
    <path d="M 175 405 L 147 405 Q 170 460 220 460 Q 270 460 293 405 L 265 405 Z" fill="#881337" />

    <!-- Right Border -->
    <path d="M 320 48 L 335 48 L 333 105 L 315 105 Z" fill="#881337" />
    <path d="M 315 105 L 333 105 L 328 165 L 306 165 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
    <path d="M 306 165 L 328 165 L 322 225 L 297 225 Z" fill="#047857" />
    <path d="M 297 225 L 322 225 L 314 285 L 288 285 Z" fill="#881337" />
    <path d="M 288 285 L 314 285 L 305 345 L 279 345 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8" />
    <path d="M 279 345 L 305 345 L 293 405 L 265 405 Z" fill="#047857" />

    <!-- Deep Crimson Velvet Top Bar -->
    <rect x="130" y="48" width="180" height="40" rx="4" fill="#881337" stroke="url(#goldTricolor)" stroke-width="2.5" />
    <circle cx="148" cy="68" r="6.5" fill="url(#sphereTricolor)" />
    <circle cx="184" cy="68" r="6.5" fill="url(#sphereTricolor)" />
    <circle cx="220" cy="68" r="6.5" fill="url(#sphereTricolor)" />
    <circle cx="256" cy="68" r="6.5" fill="url(#sphereTricolor)" />
    <circle cx="292" cy="68" r="6.5" fill="url(#sphereTricolor)" />

    <!-- Gold Caparison Shield Body -->
    <path d="M 132 90 L 308 90 L 275 410 Q 220 445 165 410 Z" fill="url(#goldTricolor)" stroke="#CA8A04" stroke-width="2" />

    <!-- Micro Studs Kurumbul Grid -->
    <g fill="#B45309" opacity="0.6">
      <circle cx="150" cy="110" r="2.5" /><circle cx="165" cy="110" r="2.5" /><circle cx="180" cy="110" r="2.5" /><circle cx="195" cy="110" r="2.5" /><circle cx="210" cy="110" r="2.5" /><circle cx="225" cy="110" r="2.5" /><circle cx="240" cy="110" r="2.5" /><circle cx="255" cy="110" r="2.5" /><circle cx="270" cy="110" r="2.5" /><circle cx="285" cy="110" r="2.5" />
      <circle cx="146" cy="135" r="2.5" /><circle cx="294" cy="135" r="2.5" />
      <circle cx="150" cy="170" r="2.5" /><circle cx="290" cy="170" r="2.5" />
      <circle cx="155" cy="210" r="2.5" /><circle cx="285" cy="210" r="2.5" />
      <circle cx="160" cy="250" r="2.5" /><circle cx="280" cy="250" r="2.5" />
      <circle cx="166" cy="290" r="2.5" /><circle cx="274" cy="290" r="2.5" />
      <circle cx="174" cy="330" r="2.5" /><circle cx="266" cy="330" r="2.5" />
      <circle cx="185" cy="370" r="2.5" /><circle cx="255" cy="370" r="2.5" />
    </g>

    <!-- Top 3 Large Golden Kumbham Spheres with Sunburst Halos -->
    <circle cx="170" cy="145" r="20" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="170" cy="145" r="14" fill="url(#sphereTricolor)" />

    <circle cx="220" cy="160" r="18" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="220" cy="160" r="12" fill="url(#sphereTricolor)" />

    <circle cx="270" cy="145" r="20" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="270" cy="145" r="14" fill="url(#sphereTricolor)" />

    <!-- Center Gold Ganesha Emblem -->
    <g transform="translate(202, 190)">
      <path d="M 18 0 C 10 -6, 5 5, 2 12 C -2 19, 5 25, 10 22 C 12 18, 14 12, 18 10 C 22 12, 24 18, 26 22 C 31 25, 38 19, 34 12 C 31 5, 26 -6, 18 0 Z" fill="url(#sphereTricolor)" stroke="#854D0E" stroke-width="1" />
      <circle cx="18" cy="8" r="4" fill="#FFF2A3" />
      <path d="M 16 16 L 16 32 Q 18 36 21 34 Q 22 30 19 28 L 20 16 Z" fill="url(#goldTricolor)" />
    </g>

    <!-- Descending Crescents -->
    <path d="M 195 245 Q 220 265 245 245 Q 220 255 195 245 Z" fill="url(#sphereTricolor)" />
    <path d="M 198 268 Q 220 288 242 268 Q 220 278 198 268 Z" fill="url(#sphereTricolor)" />
    <path d="M 201 291 Q 220 311 239 291 Q 220 301 201 291 Z" fill="url(#sphereTricolor)" />
    <path d="M 204 314 Q 220 332 236 314 Q 220 323 204 314 Z" fill="url(#sphereTricolor)" />
    <path d="M 207 337 Q 220 353 233 337 Q 220 345 207 337 Z" fill="url(#sphereTricolor)" />

    <!-- Bottom Bell Finial & Tricolor Hanging Tassel (Maroon, White & Emerald) -->
    <path d="M 210 455 L 230 455 L 225 480 L 215 480 Z" fill="url(#sphereTricolor)" stroke="#854D0E" stroke-width="1.5" />
    <circle cx="220" cy="482" r="6" fill="url(#sphereTricolor)" />

    <!-- Tricolor Hanging Tassel -->
    <path d="M 212 486 C 205 525, 202 570, 210 615" stroke="#047857" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 220 488 C 220 530, 221 575, 220 620" stroke="#881337" stroke-width="13" stroke-linecap="round" fill="none" />
    <path d="M 228 486 C 235 525, 238 570, 230 615" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" fill="none" />
    <rect x="212" y="492" width="16" height="5" rx="2" fill="url(#goldTricolor)" />
  </g>
</svg>
