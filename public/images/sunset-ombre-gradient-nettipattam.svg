<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="100%" height="100%">
  <defs>
    <linearGradient id="goldOmbre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="sphereOmbre" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>
    <linearGradient id="velvetOmbre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <filter id="shadowOmbre" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#shadowOmbre)">
    <!-- Top Hanging Cord -->
    <path d="M 210 15 L 130 48 M 210 15 L 290 48" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Spectacular Sunset Gradient Ombre Woolen Fringe (Photo 10) -->
    <!-- Tier 1: Forest Green & Navy Blue (Top) -->
    <path d="M 110 48 L 95 48 L 97 105 L 115 105 Z" fill="#047857" />
    <path d="M 310 48 L 325 48 L 323 105 L 305 105 Z" fill="#047857" />

    <!-- Tier 2: Royal Blue & Indigo -->
    <path d="M 115 105 L 97 105 L 102 175 L 125 175 Z" fill="#1D4ED8" />
    <path d="M 305 105 L 323 105 L 318 175 L 295 175 Z" fill="#1D4ED8" />

    <!-- Tier 3: Royal Purple / Magenta -->
    <path d="M 125 175 L 102 175 L 108 245 L 135 245 Z" fill="#7E22CE" />
    <path d="M 295 175 L 318 175 L 312 245 L 285 245 Z" fill="#7E22CE" />

    <!-- Tier 4: Crimson Red -->
    <path d="M 135 245 L 108 245 L 115 320 L 146 320 Z" fill="#DC2626" />
    <path d="M 285 245 L 312 245 L 305 320 L 274 320 Z" fill="#DC2626" />

    <!-- Tier 5: Saffron Flame Orange -->
    <path d="M 146 320 L 115 320 L 126 395 L 160 395 Z" fill="#EA580C" />
    <path d="M 274 320 L 305 320 L 294 395 L 260 395 Z" fill="#EA580C" />

    <!-- Tier 6: Radiant Golden Yellow (Bottom Arc) -->
    <path d="M 160 395 L 126 395 Q 150 455 210 455 Q 270 455 294 395 L 260 395 Z" fill="#EAB308" />

    <!-- Red Velvet Top Bar with 5 Studs -->
    <rect x="120" y="48" width="180" height="40" rx="4" fill="url(#velvetOmbre)" stroke="url(#goldOmbre)" stroke-width="2.5" />
    <circle cx="138" cy="68" r="6.5" fill="url(#sphereOmbre)" />
    <circle cx="174" cy="68" r="6.5" fill="url(#sphereOmbre)" />
    <circle cx="210" cy="68" r="6.5" fill="url(#sphereOmbre)" />
    <circle cx="246" cy="68" r="6.5" fill="url(#sphereOmbre)" />
    <circle cx="282" cy="68" r="6.5" fill="url(#sphereOmbre)" />

    <!-- Main Gold Caparison -->
    <path d="M 122 90 L 298 90 L 265 410 Q 210 445 155 410 Z" fill="url(#goldOmbre)" stroke="#CA8A04" stroke-width="2" />

    <!-- Micro Studs Kurumbul Grid -->
    <g fill="#B45309" opacity="0.6">
      <circle cx="140" cy="110" r="2.5" /><circle cx="155" cy="110" r="2.5" /><circle cx="170" cy="110" r="2.5" /><circle cx="185" cy="110" r="2.5" /><circle cx="200" cy="110" r="2.5" /><circle cx="215" cy="110" r="2.5" /><circle cx="230" cy="110" r="2.5" /><circle cx="245" cy="110" r="2.5" /><circle cx="260" cy="110" r="2.5" /><circle cx="275" cy="110" r="2.5" />
      <circle cx="136" cy="135" r="2.5" /><circle cx="284" cy="135" r="2.5" />
      <circle cx="140" cy="170" r="2.5" /><circle cx="280" cy="170" r="2.5" />
      <circle cx="145" cy="210" r="2.5" /><circle cx="275" cy="210" r="2.5" />
      <circle cx="150" cy="250" r="2.5" /><circle cx="270" cy="250" r="2.5" />
      <circle cx="156" cy="290" r="2.5" /><circle cx="264" cy="290" r="2.5" />
      <circle cx="164" cy="330" r="2.5" /><circle cx="256" cy="330" r="2.5" />
      <circle cx="175" cy="370" r="2.5" /><circle cx="245" cy="370" r="2.5" />
    </g>

    <!-- Top 3 Large Golden Kumbham Spheres -->
    <circle cx="160" cy="145" r="20" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="160" cy="145" r="14" fill="url(#sphereOmbre)" />

    <circle cx="210" cy="160" r="18" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="210" cy="160" r="12" fill="url(#sphereOmbre)" />

    <circle cx="260" cy="145" r="20" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="260" cy="145" r="14" fill="url(#sphereOmbre)" />

    <!-- Center Ganesha Crest -->
    <g transform="translate(192, 190)">
      <path d="M 18 0 C 10 -6, 5 5, 2 12 C -2 19, 5 25, 10 22 C 12 18, 14 12, 18 10 C 22 12, 24 18, 26 22 C 31 25, 38 19, 34 12 C 31 5, 26 -6, 18 0 Z" fill="url(#sphereOmbre)" stroke="#854D0E" stroke-width="1" />
      <circle cx="18" cy="8" r="4.5" fill="#FFF2A3" />
      <path d="M 16 16 L 16 32 Q 18 36 21 34 Q 22 30 19 28 L 20 16 Z" fill="url(#goldOmbre)" />
    </g>

    <!-- Descending Crescents -->
    <path d="M 185 245 Q 210 265 235 245 Q 210 255 185 245 Z" fill="url(#sphereOmbre)" />
    <path d="M 188 268 Q 210 288 232 268 Q 210 278 188 268 Z" fill="url(#sphereOmbre)" />
    <path d="M 191 291 Q 210 311 229 291 Q 210 301 191 291 Z" fill="url(#sphereOmbre)" />
    <path d="M 194 314 Q 210 332 226 314 Q 210 323 194 314 Z" fill="url(#sphereOmbre)" />
    <path d="M 197 337 Q 210 353 223 337 Q 210 345 197 337 Z" fill="url(#sphereOmbre)" />

    <!-- Bottom Bell Finial & Flame Orange/Red Silk Tassel -->
    <path d="M 200 455 L 220 455 L 215 480 L 205 480 Z" fill="url(#sphereOmbre)" stroke="#854D0E" stroke-width="1.5" />
    <circle cx="210" cy="482" r="6" fill="url(#sphereOmbre)" />

    <!-- Sunset Ombre Tassel (Red center, Orange & Yellow outer) -->
    <path d="M 203 486 C 196 525, 192 570, 200 615" stroke="#EA580C" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 210 488 C 210 530, 212 575, 210 620" stroke="#DC2626" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 217 486 C 224 525, 228 570, 220 615" stroke="#EAB308" stroke-width="8" stroke-linecap="round" fill="none" />
    <rect x="202" y="492" width="16" height="5" rx="2" fill="url(#goldOmbre)" />
  </g>
</svg>
