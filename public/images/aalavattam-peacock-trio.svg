<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="100%" height="100%">
  <defs>
    <linearGradient id="goldTrio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="sunburstTrio" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>
    <!-- Handheld Aalavattam Roundel Definition -->
    <g id="handheldAalavattam">
      <!-- Outer Peacock Halo -->
      <circle cx="0" cy="0" r="75" fill="#064E3B" stroke="#047857" stroke-width="2" />
      <!-- Radiant peacock feather tips -->
      <ellipse cx="0" cy="-62" rx="10" ry="6" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="31" cy="-54" rx="10" ry="6" transform="rotate(30 31 -54)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="54" cy="-31" rx="10" ry="6" transform="rotate(60 54 -31)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="62" cy="0" rx="10" ry="6" transform="rotate(90 62 0)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="54" cy="31" rx="10" ry="6" transform="rotate(120 54 31)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="31" cy="54" rx="10" ry="6" transform="rotate(150 31 54)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="0" cy="62" rx="10" ry="6" transform="rotate(180 0 62)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="-31" cy="54" rx="10" ry="6" transform="rotate(210 -31 54)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="-54" cy="31" rx="10" ry="6" transform="rotate(240 -54 31)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="-62" cy="0" rx="10" ry="6" transform="rotate(270 -62 0)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="-54" cy="-31" rx="10" ry="6" transform="rotate(300 -54 -31)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />
      <ellipse cx="-31" cy="-54" rx="10" ry="6" transform="rotate(330 -31 -54)" fill="#0284C7" stroke="#F59E0B" stroke-width="1.5" />

      <!-- Concentric Silver Pearl Ring -->
      <circle cx="0" cy="0" r="50" fill="#0F172A" stroke="#CBD5E1" stroke-width="2" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="3,3" />

      <!-- Golden Bead Ring & Sun Center -->
      <circle cx="0" cy="0" r="32" fill="url(#sunburstTrio)" stroke="#CA8A04" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#CA8A04" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#CA8A04" />

      <!-- Attached Wood Handle extending downwards -->
      <path d="M -5 70 L 5 70 L 3 130 L -3 130 Z" fill="#78350F" stroke="#B45309" stroke-width="1" />
    </g>
  </defs>

  <!-- Central Mayilpeeli Caparison Mounted on Display Tripod (Photo 4) -->
  <!-- Metal Display Stand Tripod Base -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <line x1="280" y1="360" x2="280" y2="580" stroke-width="5" />
    <line x1="280" y1="580" x2="200" y2="630" stroke-linecap="round" />
    <line x1="280" y1="580" x2="360" y2="630" stroke-linecap="round" />
    <line x1="280" y1="580" x2="280" y2="635" stroke-linecap="round" />
  </g>

  <!-- Central Peacock Nettipattam -->
  <g transform="translate(85, -20)">
    <!-- Peacock Feather Perimeter -->
    <path d="M 195 70 Q 145 220 230 420 Q 280 445 330 420 Q 415 220 365 70 Z" fill="#064E3B" stroke="#047857" stroke-width="3" />

    <!-- Top Navy Velvet Bar -->
    <polygon points="205,65 355,65 350,100 210,100" fill="#0A0F1D" stroke="#EAB308" stroke-width="2.5" />
    <circle cx="235" cy="82" r="7" fill="#EAB308" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="280" cy="82" r="7" fill="#EAB308" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="325" cy="82" r="7" fill="#EAB308" stroke="#FFFFFF" stroke-width="1" />

    <!-- Silver Pearl Face with Gold Sunbursts -->
    <path d="M 210,102 L 350,102 L 322,400 Q 280,430 238,400 Z" fill="#0F172A" stroke="#EAB308" stroke-width="2" />
    
    <g fill="#F8FAFC">
      <circle cx="225" cy="120" r="3.5" /><circle cx="240" cy="120" r="3.5" /><circle cx="255" cy="120" r="3.5" /><circle cx="270" cy="120" r="3.5" /><circle cx="285" cy="120" r="3.5" /><circle cx="300" cy="120" r="3.5" /><circle cx="315" cy="120" r="3.5" /><circle cx="330" cy="120" r="3.5" />
      <circle cx="220" cy="150" r="3" /><circle cx="340" cy="150" r="3" />
      <circle cx="225" cy="190" r="3" /><circle cx="335" cy="190" r="3" />
      <circle cx="230" cy="240" r="3" /><circle cx="330" cy="240" r="3" />
      <circle cx="240" cy="290" r="3" /><circle cx="320" cy="290" r="3" />
      <circle cx="250" cy="340" r="3" /><circle cx="310" cy="340" r="3" />
    </g>

    <!-- 3 Golden Sunbursts -->
    <circle cx="245" cy="155" r="16" fill="#F8FAFC" stroke="#EAB308" stroke-width="1.5" />
    <circle cx="245" cy="155" r="10" fill="#CA8A04" />
    <circle cx="280" cy="148" r="12" fill="#F8FAFC" stroke="#EAB308" stroke-width="1.5" />
    <circle cx="280" cy="148" r="7" fill="#CA8A04" />
    <circle cx="315" cy="155" r="16" fill="#F8FAFC" stroke="#EAB308" stroke-width="1.5" />
    <circle cx="315" cy="155" r="10" fill="#CA8A04" />

    <!-- Center Ganesha and Crescents -->
    <circle cx="280" cy="205" r="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 276 195 Q 280 190 284 195 L 282 215 Q 280 218 278 215 Z" fill="#CA8A04" />
    <path d="M 268 235 Q 280 245 292 235 Q 280 241 268 235 Z" fill="#CA8A04" />
    <path d="M 270 252 Q 280 262 290 252 Q 280 258 270 252 Z" fill="#CA8A04" />

    <!-- Bottom Tassel -->
    <path d="M 272 430 L 288 430 L 284 455 L 276 455 Z" fill="#CA8A04" />
    <circle cx="280" cy="457" r="5" fill="#EAB308" />
    <path d="M 278 460 C 275 490, 276 525, 278 545" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- The Two Flanking Handheld Aalavattam Roundels (Photos 3 & 4) -->
  <!-- Left Aalavattam Fan -->
  <g transform="translate(130, 380)">
    <use href="#handheldAalavattam" />
  </g>

  <!-- Right Aalavattam Fan -->
  <g transform="translate(430, 380)">
    <use href="#handheldAalavattam" />
  </g>
</svg>
