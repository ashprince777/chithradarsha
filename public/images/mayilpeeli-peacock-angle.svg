<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 620" width="100%" height="100%">
  <defs>
    <linearGradient id="goldAngle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="pearlAngle" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <filter id="angleShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-10" dy="12" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3D Perspective Skew & Rotation reflecting Image 4 -->
  <g filter="url(#angleShadow)" transform="matrix(0.92, -0.08, 0.18, 0.98, 15, 15)">
    <!-- Dark Peacock Feather Thick Radial Trim -->
    <path d="M 130 50 Q 80 250 170 450 Q 220 470 270 440 Q 340 230 290 50 Z" fill="#064E3B" stroke="#047857" stroke-width="4" />
    <!-- Peacock eye details around edge -->
    <ellipse cx="118" cy="95" rx="14" ry="9" transform="rotate(-30 118 95)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="108" cy="155" rx="14" ry="9" transform="rotate(-45 108 155)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="115" cy="225" rx="14" ry="9" transform="rotate(-60 115 225)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="132" cy="295" rx="14" ry="9" transform="rotate(-75 132 295)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="160" cy="365" rx="14" ry="9" transform="rotate(-90 160 365)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />

    <ellipse cx="305" cy="95" rx="14" ry="9" transform="rotate(30 305 95)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="312" cy="155" rx="14" ry="9" transform="rotate(45 312 155)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="305" cy="225" rx="14" ry="9" transform="rotate(60 305 225)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="282" cy="295" rx="14" ry="9" transform="rotate(75 282 295)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="250" cy="365" rx="14" ry="9" transform="rotate(90 250 365)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />

    <!-- Top Navy Velvet Bar -->
    <polygon points="135,50 285,50 282,90 138,90" fill="#0F172A" stroke="url(#goldAngle)" stroke-width="3" />
    <!-- 3 Golden Rosettes on Top Bar -->
    <circle cx="160" cy="70" r="9" fill="url(#goldAngle)" />
    <circle cx="210" cy="70" r="9" fill="url(#goldAngle)" />
    <circle cx="260" cy="70" r="9" fill="url(#goldAngle)" />

    <!-- Shield Face in White Silver Beads & Gold Accent Discs -->
    <polygon points="140,95 280,95 250,420 170,420" fill="#1E293B" stroke="url(#goldAngle)" stroke-width="2.5" />
    
    <!-- Rows of pearl studs -->
    <g fill="url(#pearlAngle)">
      <circle cx="155" cy="115" r="4.5" /><circle cx="170" cy="115" r="4.5" /><circle cx="185" cy="115" r="4.5" /><circle cx="200" cy="115" r="4.5" /><circle cx="215" cy="115" r="4.5" /><circle cx="230" cy="115" r="4.5" /><circle cx="245" cy="115" r="4.5" /><circle cx="260" cy="115" r="4.5" />
      <circle cx="152" cy="140" r="4" /><circle cx="268" cy="140" r="4" />
      <circle cx="155" cy="180" r="4" /><circle cx="262" cy="180" r="4" />
      <circle cx="160" cy="230" r="4" /><circle cx="254" cy="230" r="4" />
      <circle cx="168" cy="280" r="4" /><circle cx="245" cy="280" r="4" />
      <circle cx="178" cy="330" r="4" /><circle cx="235" cy="330" r="4" />
      <circle cx="190" cy="380" r="4" /><circle cx="225" cy="380" r="4" />
    </g>

    <!-- 3 Large Gold Sunburst Medallions with Silver Fluting -->
    <circle cx="175" cy="155" r="18" fill="url(#goldAngle)" />
    <circle cx="210" cy="145" r="14" fill="url(#goldAngle)" />
    <circle cx="245" cy="155" r="18" fill="url(#goldAngle)" />

    <!-- Central Embossed Elephant / Ganesha Crest -->
    <circle cx="210" cy="205" r="20" fill="url(#pearlAngle)" stroke="url(#goldAngle)" stroke-width="1.5" />
    <path d="M 205 195 Q 210 190 215 195 L 213 218 Q 210 222 207 218 Z" fill="url(#goldAngle)" />

    <!-- Descending Crescents -->
    <path d="M 195 240 Q 210 252 225 240 Q 210 248 195 240 Z" fill="url(#goldAngle)" />
    <path d="M 197 260 Q 210 272 223 260 Q 210 268 197 260 Z" fill="url(#goldAngle)" />
    <path d="M 200 280 Q 210 292 220 280 Q 210 288 200 280 Z" fill="url(#goldAngle)" />
    <path d="M 202 300 Q 210 310 218 300 Q 210 306 202 300 Z" fill="url(#goldAngle)" />

    <!-- Flanking Gold Beads -->
    <circle cx="180" cy="240" r="5" fill="url(#goldAngle)" /><circle cx="240" cy="240" r="5" fill="url(#goldAngle)" />
    <circle cx="185" cy="275" r="5" fill="url(#goldAngle)" /><circle cx="235" cy="275" r="5" fill="url(#goldAngle)" />
    <circle cx="192" cy="310" r="5" fill="url(#goldAngle)" /><circle cx="228" cy="310" r="5" fill="url(#goldAngle)" />
    <circle cx="210" cy="340" r="6" fill="url(#goldAngle)" />

    <!-- Bottom Silver Bell Cone & Dark Emerald Green Tassel (Image 4) -->
    <path d="M 202 460 L 218 460 L 214 485 L 206 485 Z" fill="url(#pearlAngle)" stroke="#64748B" stroke-width="1" />
    <circle cx="210" cy="486" r="6" fill="url(#pearlAngle)" />

    <!-- Lush Emerald Green Silk Tassel -->
    <path d="M 205 490 C 198 525, 195 565, 202 605" stroke="#064E3B" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 212 492 C 212 530, 214 570, 212 610" stroke="#047857" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 218 490 C 224 525, 226 565, 220 605" stroke="#064E3B" stroke-width="10" stroke-linecap="round" fill="none" />
    <rect x="204" y="496" width="14" height="4" rx="2" fill="url(#goldAngle)" />
  </g>
</svg>
