<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 660" width="100%" height="100%">
  <defs>
    <linearGradient id="gold5ft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="30%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="sphere5ft" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>
    <filter id="shadow5ft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Tripod Display Stand Legs (Photos 5, 6, 7) -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="230" y1="400" x2="230" y2="600" stroke-width="6" />
    <line x1="230" y1="600" x2="140" y2="650" />
    <line x1="230" y1="600" x2="320" y2="650" />
    <line x1="230" y1="600" x2="230" y2="655" />
  </g>

  <!-- Main 5.5 Ft Monumental Nettipattam on Display Stand -->
  <g filter="url(#shadow5ft)">
    <!-- Top Hanging Strut -->
    <line x1="120" y1="50" x2="340" y2="50" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
    <line x1="230" y1="15" x2="120" y2="50" stroke="#0F172A" stroke-width="2.5" />
    <line x1="230" y1="15" x2="340" y2="50" stroke="#0F172A" stroke-width="2.5" />

    <!-- Lush Peacock Feather Outer Trim (Photo 5 & 6) -->
    <path d="M 125 50 Q 75 250 175 460 Q 230 485 285 460 Q 385 250 335 50 Z" fill="#064E3B" stroke="#047857" stroke-width="4" />
    <!-- Peacock eye accents -->
    <ellipse cx="112" cy="110" rx="12" ry="7" transform="rotate(-35 112 110)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="104" cy="180" rx="12" ry="7" transform="rotate(-50 104 180)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="106" cy="250" rx="12" ry="7" transform="rotate(-65 106 250)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="120" cy="320" rx="12" ry="7" transform="rotate(-75 120 320)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="145" cy="390" rx="12" ry="7" transform="rotate(-90 145 390)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />

    <ellipse cx="348" cy="110" rx="12" ry="7" transform="rotate(35 348 110)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="356" cy="180" rx="12" ry="7" transform="rotate(50 356 180)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="354" cy="250" rx="12" ry="7" transform="rotate(65 354 250)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="340" cy="320" rx="12" ry="7" transform="rotate(75 340 320)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />
    <ellipse cx="315" cy="390" rx="12" ry="7" transform="rotate(90 315 390)" fill="#0284C7" stroke="#F59E0B" stroke-width="2" />

    <!-- Top Navy Velvet Bar -->
    <rect x="135" y="50" width="190" height="42" rx="4" fill="#0F172A" stroke="url(#gold5ft)" stroke-width="3" />
    <circle cx="152" cy="71" r="7" fill="url(#sphere5ft)" />
    <circle cx="191" cy="71" r="7" fill="url(#sphere5ft)" />
    <circle cx="230" cy="71" r="7" fill="url(#sphere5ft)" />
    <circle cx="269" cy="71" r="7" fill="url(#sphere5ft)" />
    <circle cx="308" cy="71" r="7" fill="url(#sphere5ft)" />

    <!-- 24K Gold Embossed Shield Surface -->
    <path d="M 138 95 L 322 95 L 288 440 Q 230 480 172 440 Z" fill="url(#gold5ft)" stroke="#CA8A04" stroke-width="2" />

    <!-- Micro Studs -->
    <g fill="#B45309" opacity="0.6">
      <circle cx="155" cy="115" r="2.5" /><circle cx="170" cy="115" r="2.5" /><circle cx="185" cy="115" r="2.5" /><circle cx="200" cy="115" r="2.5" /><circle cx="215" cy="115" r="2.5" /><circle cx="230" cy="115" r="2.5" /><circle cx="245" cy="115" r="2.5" /><circle cx="260" cy="115" r="2.5" /><circle cx="275" cy="115" r="2.5" /><circle cx="290" cy="115" r="2.5" /><circle cx="305" cy="115" r="2.5" />
      <circle cx="150" cy="140" r="2.5" /><circle cx="310" cy="140" r="2.5" />
      <circle cx="154" cy="180" r="2.5" /><circle cx="306" cy="180" r="2.5" />
      <circle cx="160" cy="230" r="2.5" /><circle cx="300" cy="230" r="2.5" />
      <circle cx="168" cy="280" r="2.5" /><circle cx="292" cy="280" r="2.5" />
      <circle cx="176" cy="330" r="2.5" /><circle cx="284" cy="330" r="2.5" />
      <circle cx="188" cy="380" r="2.5" /><circle cx="272" cy="380" r="2.5" />
      <circle cx="200" cy="420" r="2.5" /><circle cx="260" cy="420" r="2.5" />
    </g>

    <!-- Top 3 Large Golden Kumbham Spheres -->
    <circle cx="180" cy="150" r="22" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="180" cy="150" r="16" fill="url(#sphere5ft)" />

    <circle cx="230" cy="165" r="20" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="230" cy="165" r="14" fill="url(#sphere5ft)" />

    <circle cx="280" cy="150" r="22" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3,2" fill="none" />
    <circle cx="280" cy="150" r="16" fill="url(#sphere5ft)" />

    <!-- Center Gold Ganesha Crest -->
    <circle cx="230" cy="215" r="22" fill="url(#sphere5ft)" stroke="#854D0E" stroke-width="1.5" />
    <circle cx="230" cy="215" r="16" fill="#FEF08A" />
    <circle cx="230" cy="215" r="8" fill="url(#gold5ft)" />

    <!-- Central Auspicious Framed Deity / Temple Medallion (Photo 5) -->
    <circle cx="230" cy="265" r="18" fill="#1E1B4B" stroke="url(#gold5ft)" stroke-width="2" />
    <circle cx="230" cy="265" r="14" fill="#EAB308" opacity="0.4" />
    <circle cx="230" cy="265" r="6" fill="#FFFFFF" />

    <!-- Descending Spine of Golden Crescent Moons (Chandran) -->
    <path d="M 210 300 Q 230 318 250 300 Q 230 310 210 300 Z" fill="url(#sphere5ft)" />
    <path d="M 212 320 Q 230 338 248 320 Q 230 330 212 320 Z" fill="url(#sphere5ft)" />
    <path d="M 214 340 Q 230 358 246 340 Q 230 350 214 340 Z" fill="url(#sphere5ft)" />
    <path d="M 216 360 Q 230 376 244 360 Q 230 369 216 360 Z" fill="url(#sphere5ft)" />
    <path d="M 218 380 Q 230 394 242 380 Q 230 388 218 380 Z" fill="url(#sphere5ft)" />

    <!-- Bottom Ornate Mesh Bell Finial & Royal Peacock Blue Tassel (Photo 5 & 6) -->
    <path d="M 220 480 L 240 480 L 236 505 L 224 505 Z" fill="url(#sphere5ft)" />
    <circle cx="230" cy="508" r="6" fill="url(#sphere5ft)" />
    <!-- Intricate hanging mesh bell beads -->
    <rect x="222" y="510" width="16" height="14" rx="2" fill="#CA8A04" />
    <circle cx="225" cy="527" r="2.5" fill="#FACC15" /><circle cx="230" cy="527" r="2.5" fill="#FACC15" /><circle cx="235" cy="527" r="2.5" fill="#FACC15" />

    <!-- Cascading Royal Navy & Emerald Silk Tassel -->
    <path d="M 224 530 C 218 565, 215 605, 222 640" stroke="#064E3B" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 230 532 C 230 570, 231 610, 230 645" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 236 530 C 242 565, 245 605, 238 640" stroke="#064E3B" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>
</svg>
